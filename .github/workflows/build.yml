name: Cross-Platform Build CI

on:
  push:
    branches:
      - '**'        # Matches every branch push
  pull_request:
    branches:
      - '**'        # Matches every pull request target branch
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  # ---------------------------------------------------------------------------
  # Linux Builds (Ubuntu)
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev ninja-build

      - name: Build Shared Library
        run: |
          cmake -G Ninja -B build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLIBSERIALPORT_BUILD_EXAMPLES=ON \
            -DCMAKE_INSTALL_PREFIX=stage/shared
          cmake --build build-shared
          cmake --install build-shared

      - name: Build Static Library
        run: |
          cmake -G Ninja -B build-static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLIBSERIALPORT_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX=stage/static
          cmake --build build-static
          cmake --install build-static

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libserialport-linux-x86_64
          path: stage/

  # ---------------------------------------------------------------------------
  # macOS Builds (Apple Silicon & Intel via Universal Binary layout)
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (Apple)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Shared Library
        run: |
          cmake -G Ninja -B build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLIBSERIALPORT_BUILD_EXAMPLES=ON \
            -DCMAKE_INSTALL_PREFIX=stage/shared
          cmake --build build-shared
          cmake --install build-shared

      - name: Build Static Library
        run: |
          cmake -G Ninja -B build-static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLIBSERIALPORT_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX=stage/static
          cmake --build build-static
          cmake --install build-static

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libserialport-macos-universal
          path: stage/

  # ---------------------------------------------------------------------------
  # Windows Builds (MSYS2 Environments)
  # ---------------------------------------------------------------------------
  windows-msys2:
    name: Windows (${{ matrix.msys_env }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msys_env: mingw64
            sys_prefix: mingw-w64-x86_64
          - msys_env: ucrt64
            sys_prefix: mingw-w64-ucrt-x86_64
          - msys_env: clang64
            sys_prefix: mingw-w64-clang-x86_64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup MSYS2 Subsystem
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys_env }}
          update: true
          install: >-
            git
            make
            ${{ matrix.sys_prefix }}-cc
            ${{ matrix.sys_prefix }}-cmake
            ${{ matrix.sys_prefix }}-ninja

      - name: Build Shared Library
        run: |
          cmake -G Ninja -B build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLIBSERIALPORT_BUILD_EXAMPLES=ON \
            -DCMAKE_INSTALL_PREFIX=stage/shared
          cmake --build build-shared
          cmake --install build-shared

      - name: Build Static Library
        run: |
          cmake -G Ninja -B build-static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLIBSERIALPORT_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX=stage/static
          cmake --build build-static
          cmake --install build-static

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libserialport-windows-${{ matrix.msys_env }}
          path: stage/
